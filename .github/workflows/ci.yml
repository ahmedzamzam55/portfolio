name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

      - name: Check file encoding (UTF-8)
        run: |
          echo "Checking source files for UTF-8 encoding..."
          find src -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.css" -o -name "*.html" \) | while read f; do
            encoding=$(file --mime-encoding "$f" | awk -F': ' '{print $2}')
            if [ "$encoding" != "utf-8" ] && [ "$encoding" != "us-ascii" ]; then
              echo "ERROR: $f has encoding: $encoding (expected utf-8)"
              exit 1
            fi
          done
          echo "All source files are UTF-8 ✓"
